apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: my-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-backend
  template:
    metadata:
      labels:
        app: my-backend
    spec:
      containers:
        - name: backend-app
          image: vijay551001/three-tier-backend:latest
          ports:
            - containerPort: 5000
          env:
            # These environment variables align perfectly with your app.py configuration
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_NAME
              value: "mydb"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "secretpassword"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP # Keeps the API isolated internally so only the frontend can knock on its door
  selector:
    app: my-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
